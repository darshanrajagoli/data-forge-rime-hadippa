[project]
name = "waypoint"
version = "1.0.0"
description = "Hands-free dispatch copilot for delivery drivers. Turn-fenced tool execution over LiveKit + Rime."
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "livekit-agents[rime,silero,deepgram,openai]==1.7.1",
    "python-dotenv>=1.1.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "livekit-api>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waypoint = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
